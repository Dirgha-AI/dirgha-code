[workspace]
members = [
    "crates/dirgha-core",
    "crates/lokahi-gate",
    "crates/arniko-audit",
    "crates/memory-mgp",
    "crates/llm-router",
    "crates/agent-loop",
    "crates/flywheel-engine",
    "crates/dtrack-rs",
    "crates/native-host",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Dirgha-AI/dirgha-code"
authors = ["Salik Shah"]
keywords = ["agent", "security", "robotics", "mcp", "sbom"]
categories = ["command-line-utilities", "cryptography", "development-tools", "science::robotics"]

[workspace.dependencies]
aes-gcm = "0.10"
blake3 = "1.5"
deepseek-recipe-core = "0.2.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Non-Negotiable <25 MB Stripped Binary Profile (Target: <12 MB)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
