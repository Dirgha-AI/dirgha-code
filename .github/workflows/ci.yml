name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p native-host

  typescript:
    name: TypeScript CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Use npm 11 (the lock file is written by npm 11)
        run: npm install -g npm@11
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run --dir src
      - name: Launcher tests
        run: node --test ./bin/dirgha.test.mjs
